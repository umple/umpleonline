name: Publish Images

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to build (leave empty for branch HEAD)'
        required: false
        default: ''

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.commit || github.sha }}

  images:
    name: Build & Push Images
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      UMPLESYNC_JAR_URL: https://try.umple.org/scripts/umplesync.jar
      UMPLE_LIBRARY_URL: https://umple.org/umpleonline/umplibrary/
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2

      - name: Resolve latest LSP version
        id: lsp_version
        run: |
          echo "version=$(npm view umple-lsp-server version)" >> "$GITHUB_OUTPUT"

      - name: Resolve effective SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set image metadata
        id: meta
        run: |
          SHA="${{ steps.resolve.outputs.sha }}"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA::12}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fetch umplesync.jar
        id: umplesync_jar
        run: |
          mkdir -p jars
          curl -fL --retry 3 --retry-delay 5 "$UMPLESYNC_JAR_URL" -o jars/umplesync.jar
          sha256sum jars/umplesync.jar | tee jars/umplesync.jar.sha256
          echo "sha256=$(cut -d ' ' -f1 jars/umplesync.jar.sha256)" >> "$GITHUB_OUTPUT"

      - name: Test example seed script
        run: bun test scripts/

      # The seed is the offline example cache baked into the backend image, so
      # --verify-manifest refuses to publish unless every curated example arrived.
      - name: Fetch Umple examples
        run: bun scripts/fetch-examples.ts --library-url "$UMPLE_LIBRARY_URL" --verify-manifest

      - name: Build and push backend
        id: backend_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/backend:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.prefix }}/backend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.resolve.outputs.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            org.opencontainers.image.vendor=University of Ottawa
            org.opencontainers.image.description=UmpleOnline backend API
          build-args: |
            SOURCE_COMMIT=${{ steps.resolve.outputs.sha }}
            SOURCE_REF=${{ github.ref }}
            SOURCE_REF_NAME=${{ github.ref_name }}
            SOURCE_REF_TYPE=${{ github.ref_type }}
            BUILD_TIME=${{ steps.meta.outputs.created }}
            BACKEND_IMAGE_REF=${{ steps.meta.outputs.prefix }}/backend:${{ steps.meta.outputs.sha_tag }}
            UMPLESYNC_JAR_URL=${{ env.UMPLESYNC_JAR_URL }}
            UMPLESYNC_JAR_SHA256=${{ steps.umplesync_jar.outputs.sha256 }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          sbom: true
          provenance: true

      - name: Build and push frontend
        id: frontend_build
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/frontend:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.prefix }}/frontend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.resolve.outputs.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.vendor=University of Ottawa
            org.opencontainers.image.description=UmpleOnline frontend
          build-args: |
            APK_SECURITY_REFRESH=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          sbom: true
          provenance: true

      - name: Build and push code-exec
        id: code_exec_build
        uses: docker/build-push-action@v6
        with:
          context: code-exec
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/code-exec:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.prefix }}/code-exec:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.resolve.outputs.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.vendor=University of Ottawa
            org.opencontainers.image.description=UmpleOnline code execution service
          cache-from: type=gha,scope=code-exec
          cache-to: type=gha,mode=max,scope=code-exec
          sbom: true
          provenance: true

      - name: Build and push code-runner
        id: code_runner_build
        uses: docker/build-push-action@v6
        with:
          context: code-exec
          file: code-exec/javaRunner/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/code-runner:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.prefix }}/code-runner:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.resolve.outputs.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.vendor=University of Ottawa
            org.opencontainers.image.description=UmpleOnline sandbox runner image for code execution
          cache-from: type=gha,scope=code-runner
          cache-to: type=gha,mode=max,scope=code-runner
          sbom: true
          provenance: true

      - name: Build and push collab
        id: collab_build
        uses: docker/build-push-action@v6
        with:
          context: collab
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/collab:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.prefix }}/collab:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.resolve.outputs.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.vendor=University of Ottawa
            org.opencontainers.image.description=UmpleOnline collaboration server
          cache-from: type=gha,scope=collab
          cache-to: type=gha,mode=max,scope=collab
          sbom: true
          provenance: true

      - name: Build and push lsp-proxy
        id: lsp_proxy_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: lsp-proxy/Dockerfile
          build-args: |
            UMPLE_LSP_VERSION=${{ steps.lsp_version.outputs.version }}
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/lsp-proxy:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.prefix }}/lsp-proxy:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.resolve.outputs.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.vendor=University of Ottawa
            org.opencontainers.image.description=UmpleOnline LSP proxy server
          cache-from: type=gha,scope=lsp-proxy
          cache-to: type=gha,mode=max,scope=lsp-proxy
          sbom: true
          provenance: true

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.prefix }}/backend@${{ steps.backend_build.outputs.digest }}
          version: v0.69.3
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.prefix }}/frontend@${{ steps.frontend_build.outputs.digest }}
          version: v0.69.3
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'

      - name: Scan code-exec image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.prefix }}/code-exec@${{ steps.code_exec_build.outputs.digest }}
          version: v0.69.3
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'

      - name: Scan code-runner image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.prefix }}/code-runner@${{ steps.code_runner_build.outputs.digest }}
          version: v0.69.3
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'

      - name: Scan collab image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.prefix }}/collab@${{ steps.collab_build.outputs.digest }}
          version: v0.69.3
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'

      - name: Scan lsp-proxy image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.prefix }}/lsp-proxy@${{ steps.lsp_proxy_build.outputs.digest }}
          version: v0.69.3
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign published images
        run: |
          cosign sign --yes "${{ steps.meta.outputs.prefix }}/backend@${{ steps.backend_build.outputs.digest }}"
          cosign sign --yes "${{ steps.meta.outputs.prefix }}/frontend@${{ steps.frontend_build.outputs.digest }}"
          cosign sign --yes "${{ steps.meta.outputs.prefix }}/code-exec@${{ steps.code_exec_build.outputs.digest }}"
          cosign sign --yes "${{ steps.meta.outputs.prefix }}/code-runner@${{ steps.code_runner_build.outputs.digest }}"
          cosign sign --yes "${{ steps.meta.outputs.prefix }}/collab@${{ steps.collab_build.outputs.digest }}"
          cosign sign --yes "${{ steps.meta.outputs.prefix }}/lsp-proxy@${{ steps.lsp_proxy_build.outputs.digest }}"

      - name: Summarize published images
        run: |
          {
            echo "## Published Images"
            echo ""
            echo "- Backend: \`${{ steps.meta.outputs.prefix }}/backend:${{ steps.meta.outputs.sha_tag }}\`"
            echo "- Frontend: \`${{ steps.meta.outputs.prefix }}/frontend:${{ steps.meta.outputs.sha_tag }}\`"
            echo "- Code Exec: \`${{ steps.meta.outputs.prefix }}/code-exec:${{ steps.meta.outputs.sha_tag }}\`"
            echo "- Code Runner: \`${{ steps.meta.outputs.prefix }}/code-runner:${{ steps.meta.outputs.sha_tag }}\`"
            echo "- Collab: \`${{ steps.meta.outputs.prefix }}/collab:${{ steps.meta.outputs.sha_tag }}\`"
            echo "- LSP Proxy: \`${{ steps.meta.outputs.prefix }}/lsp-proxy:${{ steps.meta.outputs.sha_tag }}\`"
            echo "- umplesync.jar source: \`${{ env.UMPLESYNC_JAR_URL }}\`"
            echo "- umplesync.jar SHA256: \`${{ steps.umplesync_jar.outputs.sha256 }}\`"
            echo "- Signed backend digest: \`${{ steps.meta.outputs.prefix }}/backend@${{ steps.backend_build.outputs.digest }}\`"
            echo "- Signed frontend digest: \`${{ steps.meta.outputs.prefix }}/frontend@${{ steps.frontend_build.outputs.digest }}\`"
            echo "- Signed code-exec digest: \`${{ steps.meta.outputs.prefix }}/code-exec@${{ steps.code_exec_build.outputs.digest }}\`"
            echo "- Signed code-runner digest: \`${{ steps.meta.outputs.prefix }}/code-runner@${{ steps.code_runner_build.outputs.digest }}\`"
            echo "- Signed collab digest: \`${{ steps.meta.outputs.prefix }}/collab@${{ steps.collab_build.outputs.digest }}\`"
            echo "- Signed lsp-proxy digest: \`${{ steps.meta.outputs.prefix }}/lsp-proxy@${{ steps.lsp_proxy_build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
