name: umpleonline-dev

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
    volumes:
      - ./backend:/app
      - ./data/models:/data/models
      - ./jars:/jars:ro
      - ./examples:/examples:ro
      - /usr/local/bin/txl:/usr/local/bin/txl:ro
      - /usr/local/lib/txl:/usr/local/lib/txl:ro
    environment:
      - UMPLE_SYNC_JAR=/jars/umplesync.jar
      - MODEL_STORE_PATH=/data/models
      - EXAMPLE_PATH=/examples
      - CODE_EXEC_PORT=${CODE_EXEC_PORT:-4401}
      - COLLAB_PORT=${COLLAB_PORT:-3002}
      - LSP_PORT=${LSP_PORT:-9999}
      - PORT=${BACKEND_PORT:-3001}
      - SOURCE_COMMIT=${SOURCE_COMMIT:-}
      - SOURCE_REF=${SOURCE_REF:-}
      - SOURCE_REF_NAME=${SOURCE_REF_NAME:-}
      - SOURCE_REF_TYPE=branch
      - BUILD_TIME=${BUILD_TIME:-}
    depends_on:
      code-exec:
        condition: service_healthy

  collab:
    build:
      context: ./collab
      dockerfile: Dockerfile.dev
    ports:
      - "${COLLAB_PORT:-3002}:${COLLAB_PORT:-3002}"
    volumes:
      - ./collab:/app
      - /app/node_modules
    environment:
      - PORT=${COLLAB_PORT:-3002}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${COLLAB_PORT:-3002}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  lsp-proxy:
    build:
      context: .
      dockerfile: lsp-proxy/Dockerfile
      args:
        UMPLE_LSP_VERSION: ${UMPLE_LSP_VERSION:-latest}
    ports:
      - "${LSP_PORT:-9999}:${LSP_PORT:-9999}"
    volumes:
      - ./data/models:/data/models
      - ./jars:/jars:ro
    environment:
      - UMP_BASE_DIR=/data/models
      - UMPLESYNC_JAR_PATH=/jars/umplesync.jar
      - LSP_PORT=${LSP_PORT:-9999}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${LSP_PORT:-9999}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  code-exec:
    build:
      context: ./code-exec
    ports:
      - "${CODE_EXEC_PORT:-4401}:${CODE_EXEC_PORT:-4401}"
    environment:
      - PORT=${CODE_EXEC_PORT:-4401}
      - STATUS_COMPOSE_PROJECT=${COMPOSE_PROJECT_NAME:-umpleonline-dev}
      - EXECUTION_RUNNER_IMAGE=${CODE_RUNNER_IMAGE:-umple-code-runner:dev}
      - EXECUTION_RUNNER_AUTO_BUILD=1
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/models:/data/models
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${CODE_EXEC_PORT:-4401}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
