name: umpleonline-prod

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/umple/umpleonline/backend:latest}
    restart: unless-stopped
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/models:/data/models
      - /usr/local/bin/txl:/usr/local/bin/txl:ro
      - /usr/local/lib/txl:/usr/local/lib/txl:ro
    environment:
      - UMPLE_SYNC_JAR=/jars/umplesync.jar
      - MODEL_STORE_PATH=/data/models
      - EXAMPLE_PATH=/examples
      - CODE_EXEC_PORT=${CODE_EXEC_PORT:-4401}
      - COLLAB_PORT=${COLLAB_PORT:-3002}
      - LSP_PORT=${LSP_PORT:-9999}
      - PORT=${BACKEND_PORT:-3001}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - DEPLOYED_AT=${DEPLOYED_AT:-}
      - DEPLOYED_SOURCE_COMMIT=${DEPLOYED_SOURCE_COMMIT:-}
      - DEPLOYED_SOURCE_REF=${DEPLOYED_SOURCE_REF:-}
      - RELEASE_TAG=${RELEASE_TAG:-}
    depends_on:
      code-exec:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:${BACKEND_PORT:-3001}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  collab:
    image: ${COLLAB_IMAGE:-ghcr.io/umple/umpleonline/collab:latest}
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    environment:
      - PORT=${COLLAB_PORT:-3002}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${COLLAB_PORT:-3002}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/umple/umpleonline/frontend:latest}
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-3001}
      - COLLAB_PORT=${COLLAB_PORT:-3002}
      - LSP_PORT=${LSP_PORT:-9999}
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_HOST_PORT:-3100}:80"
    depends_on:
      backend:
        condition: service_healthy
      collab:
        condition: service_healthy
      lsp-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  lsp-proxy:
    image: ${LSP_PROXY_IMAGE:-ghcr.io/umple/umpleonline/lsp-proxy:latest}
    restart: unless-stopped
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/models:/data/models
    environment:
      - UMP_BASE_DIR=/data/models
      - UMPLESYNC_JAR_PATH=/jars/umplesync.jar
      - LSP_PORT=${LSP_PORT:-9999}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${LSP_PORT:-9999}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  code-exec:
    image: ${CODE_EXEC_IMAGE:-ghcr.io/umple/umpleonline/code-exec:latest}
    restart: unless-stopped
    cpus: 1
    mem_limit: 768m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/models:/data/models
    environment:
      - PORT=${CODE_EXEC_PORT:-4401}
      - STATUS_COMPOSE_PROJECT=${COMPOSE_PROJECT_NAME:-umpleonline-prod}
      - EXECUTION_RUNNER_IMAGE=${CODE_RUNNER_IMAGE:-ghcr.io/umple/umpleonline/code-runner:latest}
      - EXECUTION_RUNNER_AUTO_BUILD=0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${CODE_EXEC_PORT:-4401}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
